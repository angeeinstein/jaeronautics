name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Pango
        # WeasyPrint makes the legal texts' PDFs with it; usually on the runner already.
        run: |
          dpkg -s libpango-1.0-0 libpangoft2-1.0-0 >/dev/null 2>&1 \
            || (sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0)

      - name: Install dependencies
        # The lock file, so CI tests the exact versions a deploy installs.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        # On every core of the runner (pytest-xdist).
        run: python -m pytest -q -n auto
