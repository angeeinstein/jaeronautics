name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The versions the servers run: Ubuntu 24.04 (pinned, not ubuntu-latest, so
# CI does not move to another release on its own), its Python, and the Node.js
# long-term-support release install.sh installs.
#
# How long it takes, without testing less (docs/maintenance.md, "CI"):
# - the jobs run side by side, the end-to-end tests in three parts, each on
#   its own runner with its own fresh server -- as isolated as one run was;
# - files that passed already are not tested again: every run that passes
#   leaves a mark named after its files' git tree hash (job "passed"), and a
#   run on the very same files -- above all on main after merging a pull
#   request, whose run tested exactly the merged files -- finds it and skips
#   the tests (job "tested"). Any other change, even a byte, runs everything.
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

# Read-only, except where a job asks for more (publish-frontend).
permissions:
  contents: read

jobs:
  tested:
    # Whether these very files passed CI already. Only a mark left by a run in
    # this repository counts (not one from a fork's pull request), and when
    # GitHub cannot be asked, everything runs.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      already: ${{ steps.look.outputs.already }}
      tree: ${{ steps.look.outputs.tree }}
    steps:
      - uses: actions/checkout@v7

      - name: Passed already?
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          found="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ci-passed-${tree}&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)
                   | select(.workflow_run.head_repository_id == ${{ github.repository_id }})] | length' \
            2>/dev/null || echo 0)"
          if [[ "${found}" =~ ^[1-9][0-9]*$ ]]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "These files (tree ${tree}) passed CI already: the tests are not run again."
          else
            echo "Not tested yet (tree ${tree}): everything runs."
          fi

  test:
    needs: tested
    if: needs.tested.outputs.already != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Pango and HarfBuzz-Subset
        # WeasyPrint makes the legal texts' PDFs with them; usually on the runner already.
        run: |
          dpkg -s libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 >/dev/null 2>&1 \
            || (sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0)

      - name: Install dependencies
        # The lock file, so CI tests the exact versions a deploy installs.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        # On every core of the runner (pytest-xdist).
        run: python -m pytest -q -n auto

  frontend:
    needs: tested
    if: needs.tested.outputs.already != 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install --require-hashes -r ../requirements.lock

      - name: The API's types are current
        # Generated from the API's own description; a change to the API without
        # regenerating them would leave the front end checking against the old one.
        working-directory: .
        run: |
          DATABASE_URL="sqlite:///$RUNNER_TEMP/schema.db" python -m flask --app aeronautics_members.app:create_app \
            api-schema --out frontend/src/api/openapi.json
          (cd frontend && npm run api:types)
          git diff --exit-code -- frontend/src/api/ \
            || (echo "The API changed: regenerate the types (docs/frontend-plan.md, Working on it)." && exit 1)

      - name: Type check
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Component tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    # Beside the other jobs rather than after them, in three parts. Each part
    # starts its own server on a fresh database (playwright.config.ts), so no
    # part sees what another one saved; all three together are every test.
    needs: tested
    if: needs.tested.outputs.already != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          pip install --require-hashes -r requirements-dev.lock
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build the front end
        run: npm run build
        working-directory: frontend

      - name: End-to-end tests (Playwright), part ${{ matrix.shard }} of 3
        run: npm run e2e -- --shard=${{ matrix.shard }}/3
        working-directory: frontend
        env:
          PYTHON: python

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

  passed:
    # Everything above passed on these files: the mark job "tested" looks for.
    # Every job that tests belongs in "needs" here.
    needs: [tested, test, frontend, e2e]
    if: needs.tested.outputs.already != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Which files passed
        run: echo "${{ needs.tested.outputs.tree }}" > "$RUNNER_TEMP/tree"

      - name: Leave the mark
        uses: actions/upload-artifact@v7
        with:
          name: ci-passed-${{ needs.tested.outputs.tree }}
          path: ${{ runner.temp }}/tree
          retention-days: 30

  publish-frontend:
    # The built front end for the servers: install.sh downloads it instead of
    # building on a server with 1 GB of RAM. Published once the tests have
    # passed, to the "frontend-builds" pre-release, as one file per version of
    # frontend/ -- named by its git tree hash, so a commit that changes only
    # Python reuses the build before it.
    # Also when the tests were skipped because these files passed already;
    # never when one of them failed.
    if: github.event_name == 'push' && !failure() && !cancelled()
    needs: [tested, test, frontend, e2e]
    runs-on: ubuntu-24.04
    # A build that could not be published is not a failed commit: the
    # installer then builds it itself.
    continue-on-error: true
    permissions:
      contents: write
    # One at a time: they all add to the same release.
    concurrency:
      group: publish-frontend
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: frontend-builds
      KEEP: 200
    steps:
      - uses: actions/checkout@v7

      - name: Which build this is
        id: build
        run: |
          tree="$(git rev-parse HEAD:frontend)"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          echo "name=frontend-${tree}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Published already?
        id: published
        run: |
          if curl -fsIL -o /dev/null \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE}/${{ steps.build.outputs.name }}"; then
            echo "yes=1" >> "$GITHUB_OUTPUT"
            echo "This version of frontend/ is published already."
          fi

      - name: Set up Node.js
        if: steps.published.outputs.yes != '1'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        if: steps.published.outputs.yes != '1'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --outDir "$RUNNER_TEMP/app" --emptyOutDir
          # What the installer checks it was built from.
          echo "${{ steps.build.outputs.tree }}" > "$RUNNER_TEMP/app/.build-tree"
          tar -czf "$RUNNER_TEMP/${{ steps.build.outputs.name }}" -C "$RUNNER_TEMP/app" .

      - name: Publish
        if: steps.published.outputs.yes != '1'
        run: |
          if ! gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release create "$RELEASE" --prerelease --target "$GITHUB_SHA" --title "Front-end builds" \
              --notes "The built front end, one file per version of frontend/, for install.sh to download. Made by CI; not a release of the portal."
          fi
          gh release upload "$RELEASE" "$RUNNER_TEMP/${{ steps.build.outputs.name }}" --clobber

      - name: Keep the newest builds
        # And this commit's, however old: reused by every commit that left frontend/ alone.
        run: |
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE}" --jq .id)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | "\(.created_at) \(.id) \(.name)"' \
            | grep -v " ${{ steps.build.outputs.name }}$" \
            | sort -r | tail -n +"${KEEP}" | cut -d' ' -f2 \
            | while read -r asset; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}"; done
