name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The versions the servers run: Ubuntu 24.04's Python, and the Node.js
# long-term-support release install.sh installs.
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Pango and HarfBuzz-Subset
        # WeasyPrint makes the legal texts' PDFs with them; usually on the runner already.
        run: |
          dpkg -s libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 >/dev/null 2>&1 \
            || (sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0)

      - name: Install dependencies
        # The lock file, so CI tests the exact versions a deploy installs.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        # On every core of the runner (pytest-xdist).
        run: python -m pytest -q -n auto

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install --require-hashes -r ../requirements.lock

      - name: The API's types are current
        # Generated from the API's own description; a change to the API without
        # regenerating them would leave the front end checking against the old one.
        working-directory: .
        run: |
          DATABASE_URL="sqlite:///$RUNNER_TEMP/schema.db" python -m flask --app aeronautics_members.app:create_app \
            api-schema --out frontend/src/api/openapi.json
          (cd frontend && npm run api:types)
          git diff --exit-code -- frontend/src/api/ \
            || (echo "The API changed: regenerate the types (docs/frontend-plan.md, Working on it)." && exit 1)

      - name: Type check
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Component tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          pip install --require-hashes -r requirements-dev.lock
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build the front end
        run: npm run build
        working-directory: frontend

      - name: End-to-end tests (Playwright)
        run: npm run e2e
        working-directory: frontend
        env:
          PYTHON: python

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
