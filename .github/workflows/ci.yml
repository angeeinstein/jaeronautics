name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # The lock file, so CI tests the exact versions a deploy installs.
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q
