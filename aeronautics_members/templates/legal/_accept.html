{#- The one tick at signup: every text accepted then, each a link that opens it
    over the form (legal-dialog.js), or in a new tab without JavaScript. Expects
    ``field``, the form's terms_accepted checkbox. -#}
{%- set texts = legal_texts_to_accept() -%}
<div class="form-check">
    {{ field(class="form-check-input") }}
    <label class="form-check-label" for="{{ field.id }}">
        {{ _('I accept the') }}
        {% for text in texts -%}
            <a href="{{ url_for('public.legal_text', slug=text.slug) }}" target="_blank" rel="noopener" data-legal-dialog class="text-decoration-underline">{{ _(text.english) }}</a>
            {%- if loop.revindex == 2 %} {{ _('and the') }} {% elif not loop.last %}, {{ _('the') }} {% endif %}
        {%- endfor %}.<span class="text-danger">*</span>
    </label>
</div>
<script src="{{ url_for('static', filename='legal-dialog.js') }}"></script>
