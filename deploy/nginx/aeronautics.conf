server {
    listen 80;
    server_name members.joanneum-aeronautics.stream;

    # Tell browsers to use HTTPS for this host from now on. Sent from the
    # port-80 block too, because TLS terminates at the Cloudflare Tunnel and the
    # browser still receives this over HTTPS; a browser ignores it on plain HTTP.
    # No "preload" -- that is hard to reverse and belongs to a deliberate choice.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'none';" always;

    location /static/ {
        alias /var/www/jaeronautics/aeronautics_members/static/;
        expires 30d;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
}
