# The Content-Security-Policy is not set here: the portal sets it on every
# answer itself, with a fresh nonce each time (aeronautics_members/content_security.py).
# A second, fixed policy here would apply as well and block what the first allows.

# The devices' "nothing changed" sign of life (304, every 2 seconds) is not
# logged; every other request is (install.sh, render_nginx_config).
map "$request_method $uri $status" $jaeronautics_logged {
    "GET /api/v1/device 304" 0;
    default 1;
}

server {
    listen 80;
    server_name members.joanneum-aeronautics.stream;

    # Tell browsers to use HTTPS for this host from now on. Sent from the
    # port-80 block too, because TLS terminates at the Cloudflare Tunnel and the
    # browser still receives this over HTTPS; a browser ignores it on plain HTTP.
    # No "preload" -- that is hard to reverse and belongs to a deliberate choice.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The visitor's own address, which Cloudflare's tunnel passes on: without
    # it every request comes from 127.0.0.1, and each limit per address is one
    # limit shared by all visitors. As install.sh writes it.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    client_max_body_size 20m;

    # While the portal itself does not answer -- restarting during an update,
    # or down -- nginx shows a page of its own instead of "Bad gateway" (503).
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/jaeronautics/aeronautics_members/static;
        internal;
    }

    access_log /var/log/nginx/access.log combined if=$jaeronautics_logged;

    location /static/ {
        alias /var/www/jaeronautics/aeronautics_members/static/;
        expires 30d;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
}
