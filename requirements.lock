# Runtime dependencies. This is what install.sh deploys.
# Fully resolved dependency set, pinned by version and verified by hash.
#
# requirements.txt says what the application asks for; this file says exactly
# what gets installed, down to the transitive dependencies those requirements
# pull in. Without it, two installs a week apart can differ -- a new release of
# something we never named ourselves arrives in between -- and a compromised or
# substituted package on the index would be installed without complaint. The
# hashes make that a build failure instead.
#
# Regenerate after changing requirements.txt (both lock files together, so the
# shared pins cannot drift apart):
#
#   pip install pip-tools
#   pip-compile --generate-hashes --strip-extras --no-header \
#       --output-file=requirements.lock requirements.txt
#   pip-compile --generate-hashes --strip-extras --no-header \
#       --output-file=requirements-dev.lock requirements-dev.txt
#
# then restore these header comments and run the tests.
#
# Resolved on Python 3.11/linux. The hashes cover every distribution published
# for each version, so other platforms and newer Python versions install from
# the same file; a version that has no wheel for a newer Python builds from the
# source distribution instead.

